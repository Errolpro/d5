
trigger:
  - main

pool:
  vmImage: 'windows-latest'

steps:
  # Step 1: Build Java application
  - task: Maven@4
    displayName: 'Build Java Application'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean package'
  
  
  # Step 2: Find generated JAR/WAR
  - powershell: |
      Write-Host "=== PROJECT STRUCTURE ==="

      Get-ChildItem "$(Build.SourcesDirectory)" -Recurse -Filter pom.xml |
      Select-Object FullName

      Write-Host "=== GENERATED JAR AND WAR FILES ==="

      Get-ChildItem "$(Build.SourcesDirectory)" -Recurse -Include *.jar,*.war |
      Select-Object FullName, Length

    displayName: 'Check Generated Files'

  # Step 3: Publish Maven target folder
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Application Artifact'
    inputs:
      PathtoPublish: '$(Build.SourcesDirectory)/target'
      ArtifactName: 'application'
      publishLocation: 'Container'
