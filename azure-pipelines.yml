
trigger:
  - main

pool:
  vmImage: 'windows-latest'

steps:
  # Step 1: Build Java application
  - task: Maven@4
    displayName: 'Build Java Application'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean package'

  # Step 2: Find generated JAR/WAR
  - powershell: |
      Write-Host "Searching for generated artifacts..."

      Get-ChildItem -Path "$(Build.SourcesDirectory)" `
        -Recurse -Include *.war,*.jar |
        Select-Object FullName, Length

    displayName: 'Check Generated Files'

  # Step 3: Publish Maven target folder
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Application Artifact'
    inputs:
      PathtoPublish: '$(Build.SourcesDirectory)/target'
      ArtifactName: 'application'
      publishLocation: 'Container'
